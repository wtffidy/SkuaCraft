plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'io.github.wtffidy.skuacraft'
version = '0.1.0-alpha.2'

base {
    archivesName = 'SkuaCraft'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                skuacraft {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                skuacraft {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    implementation fg.deobf('curse.maven:rinku-1366156:8745377')
}

tasks.named('processResources') {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        forge_version: '47.4.28',
        mod_id: 'skuacraft',
        mod_name: 'SkuaCraft',
        mod_license: 'All Rights Reserved',
        mod_version: project.version.toString(),
        mod_authors: 'wtffidy',
        mod_description: 'The real AQW and Skua player, hosted inside Minecraft.'
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'     : 'skuacraft',
            'Specification-Vendor'    : 'wtffidy',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'wtffidy'
        ])
    }
}
