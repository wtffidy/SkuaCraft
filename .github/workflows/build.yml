name: Build SkuaCraft

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    name: Build Minecraft mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Build with ForgeGradle
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkuaCraft-Mod-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

  player-host:
    name: Build Windows Skua player host
    runs-on: windows-latest
    steps:
      - name: Check out source and MVS runtime
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows player host
        shell: pwsh
        run: dotnet publish ./player-host/SkuaCraft.PlayerHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o ./player-host/publish/win-x64

      - name: Smoke test embedded Skua player host
        shell: pwsh
        run: ./player-host/SmokeTest.ps1

      - name: Upload player host
        uses: actions/upload-artifact@v4
        with:
          name: SkuaCraft-PlayerHost-win-x64-${{ github.sha }}
          path: player-host/publish/win-x64/**
          if-no-files-found: error
