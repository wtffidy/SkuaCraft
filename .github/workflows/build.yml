name: Build SkuaCraft

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build with Gradle 8.8
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.8'
          arguments: build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkuaCraft-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
