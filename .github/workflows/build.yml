name: Build SkuaCraft

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod and Windows player host
    runs-on: windows-latest
    steps:
      - name: Check out source and MVS runtime
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Minecraft mod
        shell: pwsh
        run: ./Build.ps1 -SkipFolderPicker

      - name: Publish self-contained Windows player host
        shell: pwsh
        run: dotnet publish ./player-host/SkuaCraft.PlayerHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o ./player-host/publish/win-x64

      - name: Smoke test player host
        shell: pwsh
        run: ./player-host/SmokeTest.ps1
