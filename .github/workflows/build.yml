name: Build and Release SkuaCraft

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod and Windows player host
    runs-on: windows-latest
    steps:
      - name: Check out source and MVS runtime
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Minecraft mod
        shell: pwsh
        run: ./Build.ps1 -SkipFolderPicker

      - name: Publish self-contained Windows player host
        shell: pwsh
        run: dotnet publish ./player-host/SkuaCraft.PlayerHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o ./player-host/publish/win-x64

      - name: Smoke test player host
        shell: pwsh
        run: ./player-host/SmokeTest.ps1

      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $gradleText = Get-Content ./build.gradle -Raw
          $versionMatch = [regex]::Match($gradleText, "(?m)^version\s*=\s*'([^']+)'")
          if (-not $versionMatch.Success) {
            throw "Could not read the project version from build.gradle."
          }
          if ($versionMatch.Groups[1].Value -ne $tagVersion) {
            throw "Release tag $tagVersion does not match build.gradle version $($versionMatch.Groups[1].Value)."
          }

          $modJars = @(Get-ChildItem ./build/libs -Filter "*.jar" -File | Where-Object { $_.Name -notmatch '(-sources|-javadoc)\.jar$' })
          if ($modJars.Count -ne 1) {
            throw "Expected exactly one installable mod JAR, found $($modJars.Count)."
          }

          New-Item -ItemType Directory -Path ./release -Force | Out-Null
          Copy-Item $modJars[0].FullName "./release/SkuaCraft-$tagVersion.jar" -Force
          Compress-Archive -Path ./player-host/publish/win-x64/* -DestinationPath "./release/SkuaCraft-PlayerHost-win-x64-$tagVersion.zip" -CompressionLevel Optimal -Force

          if (-not (Test-Path "./release/SkuaCraft-PlayerHost-win-x64-$tagVersion.zip")) {
            throw "Player host release archive was not created."
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $assets = @(
            "./release/SkuaCraft-$version.jar",
            "./release/SkuaCraft-PlayerHost-win-x64-$version.zip"
          )
          $arguments = @("release", "create", $tag) + $assets + @("--title", "SkuaCraft $version", "--generate-notes", "--verify-tag")
          if ($version -match '(?i)(alpha|beta|rc|preview|pre)') {
            $arguments += "--prerelease"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
