name: Release SkuaCraft

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Exact version override (for example 0.1.0-alpha.7 or 1.0.0). Leave blank to use the channel options."
        required: false
        type: string
      release_channel:
        description: "Automatically advance the current release version."
        required: true
        type: choice
        default: next-build
        options:
          - next-build
          - alpha
          - beta
          - stable
      build_number:
        description: "Optional exact alpha/beta build number (for example 7). Leave blank to increment automatically."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-latest
    steps:
      - name: Check out source and MVS runtime
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve release version
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          $ErrorActionPreference = "Stop"
          $SemVerPattern = '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?:-(?<stage>alpha|beta)\.(?<build>[1-9]\d*))?$'
          $GradleText = Get-Content ./build.gradle -Raw
          $ProjectVersionMatch = [regex]::Match($GradleText, "getOrElse\('([^']+)'\)")
          if (-not $ProjectVersionMatch.Success) {
            throw "Could not read the default project version from build.gradle."
          }

          $ProjectVersion = $ProjectVersionMatch.Groups[1].Value
          if ($ProjectVersion -notmatch $SemVerPattern) {
            throw "The default project version '$ProjectVersion' is not a supported SkuaCraft semantic version."
          }

          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $Tag = $env:GITHUB_REF_NAME
            if (-not $Tag.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
              throw "Release tags must start with 'v'. Received: $Tag"
            }
            $Version = $Tag.Substring(1)
            if ($Version -notmatch $SemVerPattern) {
              throw "Release tag '$Tag' is not a supported version. Use x.y.z, x.y.z-alpha.N or x.y.z-beta.N."
            }
          }
          else {
            $ManualVersion = ([string]$env:RELEASE_VERSION_INPUT).Trim()
            $BuildNumberText = ([string]$env:BUILD_NUMBER_INPUT).Trim()
            $Channel = $env:RELEASE_CHANNEL
            if ([string]::IsNullOrWhiteSpace($Channel)) {
              $Channel = "next-build"
            }

            if (-not [string]::IsNullOrWhiteSpace($ManualVersion)) {
              if ($ManualVersion -notmatch $SemVerPattern) {
                throw "Invalid manual version '$ManualVersion'. Use x.y.z, x.y.z-alpha.N or x.y.z-beta.N."
              }
              if (-not [string]::IsNullOrWhiteSpace($BuildNumberText)) {
                throw "Use either an exact release version or a build number, not both."
              }
              $Version = $ManualVersion
            }
            else {
              $CurrentVersionMatch = [regex]::Match($ProjectVersion, $SemVerPattern)
              $CoreVersion = "$($CurrentVersionMatch.Groups['major'].Value).$($CurrentVersionMatch.Groups['minor'].Value).$($CurrentVersionMatch.Groups['patch'].Value)"
              $CurrentStage = $CurrentVersionMatch.Groups['stage'].Value
              $CurrentBuild = 0
              if ($CurrentVersionMatch.Groups['build'].Success) {
                $CurrentBuild = [int]$CurrentVersionMatch.Groups['build'].Value
              }

              if (-not [string]::IsNullOrWhiteSpace($BuildNumberText)) {
                if ($BuildNumberText -notmatch '^[1-9]\d*$') {
                  throw "Build number must be a positive whole number, for example 7."
                }
                $RequestedBuildNumber = [int]$BuildNumberText
              }
              else {
                $RequestedBuildNumber = 0
              }

              $GetNextBuildNumber = {
                param([string]$Stage)
                $Maximum = 0
                if ($CurrentStage -eq $Stage) {
                  $Maximum = $CurrentBuild
                }

                $EscapedCore = [regex]::Escape($CoreVersion)
                $ExistingTags = @(& git tag --list "v$CoreVersion-$Stage.*")
                foreach ($ExistingTag in $ExistingTags) {
                  if ($ExistingTag -match "^v$EscapedCore-$Stage\.([1-9]\d*)$") {
                    $ExistingBuild = [int]$Matches[1]
                    if ($ExistingBuild -gt $Maximum) {
                      $Maximum = $ExistingBuild
                    }
                  }
                }

                return ($Maximum + 1)
              }

              switch ($Channel) {
                "next-build" {
                  if ($CurrentStage -eq "alpha" -or $CurrentStage -eq "beta") {
                    $Stage = $CurrentStage
                    $NextBuildNumber = & $GetNextBuildNumber $Stage
                    $Build = if ($RequestedBuildNumber -gt 0) { $RequestedBuildNumber } else { $NextBuildNumber }
                    $Version = "$CoreVersion-$Stage.$Build"
                  }
                  else {
                    if ($RequestedBuildNumber -gt 0) {
                      throw "A build number can only be used with alpha or beta releases. Choose a channel or enter an exact version."
                    }
                    $Patch = [int]$CurrentVersionMatch.Groups['patch'].Value + 1
                    $Version = "$($CurrentVersionMatch.Groups['major'].Value).$($CurrentVersionMatch.Groups['minor'].Value).$Patch"
                  }
                }
                "alpha" {
                  $NextBuildNumber = & $GetNextBuildNumber "alpha"
                  $Build = if ($RequestedBuildNumber -gt 0) { $RequestedBuildNumber } else { $NextBuildNumber }
                  $Version = "$CoreVersion-alpha.$Build"
                }
                "beta" {
                  $NextBuildNumber = & $GetNextBuildNumber "beta"
                  $Build = if ($RequestedBuildNumber -gt 0) { $RequestedBuildNumber } else { $NextBuildNumber }
                  $Version = "$CoreVersion-beta.$Build"
                }
                "stable" {
                  if ($RequestedBuildNumber -gt 0) {
                    throw "Stable releases do not use prerelease build numbers."
                  }
                  $Version = "1.0.0"
                }
                default {
                  throw "Unknown release channel '$Channel'."
                }
              }
            }

            $Tag = "v$Version"
          }

          if ($Version -notmatch $SemVerPattern) {
            throw "Resolved release version '$Version' is invalid."
          }

          "RELEASE_TAG=$Tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "[RELEASE] Selected version: $Version" -ForegroundColor Green
          Write-Host "[RELEASE] Git tag: $Tag" -ForegroundColor Green

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Minecraft mod
        shell: pwsh
        run: ./Build.ps1 -SkipPrompts -ProjectVersion $env:RELEASE_VERSION

      - name: Smoke test player host
        shell: pwsh
        run: ./player-host/SmokeTest.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package release assets
        shell: pwsh
        run: |
          $Version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($Version)) {
            throw "The release version was not resolved before packaging."
          }

          $modJars = @(Get-ChildItem ./build/libs -Filter "*.jar" -File | Where-Object { $_.Name -notmatch '(-sources|-javadoc)\.jar$' })
          if ($modJars.Count -ne 1) {
            throw "Expected exactly one installable mod JAR, found $($modJars.Count)."
          }

          New-Item -ItemType Directory -Path ./release -Force | Out-Null
          Copy-Item $modJars[0].FullName "./release/SkuaCraft-$Version.jar" -Force
          Copy-Item ./player-host/Install-PlayerHost.ps1 ./player-host/publish/win-x64/Install-PlayerHost.ps1 -Force
          Compress-Archive -Path ./player-host/publish/win-x64/* -DestinationPath "./release/SkuaCraft-PlayerHost-win-x64-$Version.zip" -CompressionLevel Optimal -Force

          if (-not (Test-Path "./release/SkuaCraft-PlayerHost-win-x64-$Version.zip")) {
            throw "Player host release archive was not created."
          }

      - name: Build guided Windows installer
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -Version $env:RELEASE_VERSION

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $assets = @(
            "./release/SkuaCraft-Setup-$version.exe",
            "./release/SkuaCraft-$version.jar",
            "./release/Rinku-3.0.4.jar",
            "./release/SkuaCraft-PlayerHost-win-x64-$version.zip"
          )

          if (-not (Test-Path $assets[0])) {
            throw "The guided Windows installer is missing."
          }

          & gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Uploading release assets failed with exit code $LASTEXITCODE."
            }

            $editArguments = @("release", "edit", $tag, "--title", "SkuaCraft $version")
            if ($version -match '(?i)(alpha|beta|rc|preview|pre)') {
              $editArguments += "--prerelease"
            }
            else {
              $editArguments += "--latest"
            }
            & gh @editArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Updating release metadata failed with exit code $LASTEXITCODE."
            }
          }
          else {
            $arguments = @("release", "create", $tag) + $assets + @("--title", "SkuaCraft $version", "--generate-notes", "--target", $env:GITHUB_SHA)
            if ($version -match '(?i)(alpha|beta|rc|preview|pre)') {
              $arguments += "--prerelease"
            }
            else {
              $arguments += "--latest"
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE."
            }
          }
