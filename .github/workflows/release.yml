name: Release SkuaCraft

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-latest
    steps:
      - name: Check out source and MVS runtime
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Minecraft mod
        shell: pwsh
        run: ./Build.ps1 -SkipPrompts

      - name: Smoke test player host
        shell: pwsh
        run: ./player-host/SmokeTest.ps1

      - name: Package release assets
        shell: pwsh
        run: |
          $gradleText = Get-Content ./build.gradle -Raw
          $versionMatch = [regex]::Match($gradleText, "(?m)^version\s*=\s*'([^']+)'")
          if (-not $versionMatch.Success) {
            throw "Could not read the project version from build.gradle."
          }

          $projectVersion = $versionMatch.Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tagVersion = $projectVersion
            $tag = "v$tagVersion"
          }
          else {
            $tag = $env:GITHUB_REF_NAME
            if (-not $tag.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
              throw "Release tags must start with 'v'. Received: $tag"
            }
            $tagVersion = $tag.Substring(1)
          }

          if ($projectVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match build.gradle version $projectVersion."
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $modJars = @(Get-ChildItem ./build/libs -Filter "*.jar" -File | Where-Object { $_.Name -notmatch '(-sources|-javadoc)\.jar$' })
          if ($modJars.Count -ne 1) {
            throw "Expected exactly one installable mod JAR, found $($modJars.Count)."
          }

          New-Item -ItemType Directory -Path ./release -Force | Out-Null
          Copy-Item $modJars[0].FullName "./release/SkuaCraft-$tagVersion.jar" -Force
          Copy-Item ./player-host/Install-PlayerHost.ps1 ./player-host/publish/win-x64/Install-PlayerHost.ps1 -Force
          Compress-Archive -Path ./player-host/publish/win-x64/* -DestinationPath "./release/SkuaCraft-PlayerHost-win-x64-$tagVersion.zip" -CompressionLevel Optimal -Force

          if (-not (Test-Path "./release/SkuaCraft-PlayerHost-win-x64-$tagVersion.zip")) {
            throw "Player host release archive was not created."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $assets = @(
            "./release/SkuaCraft-$version.jar",
            "./release/SkuaCraft-PlayerHost-win-x64-$version.zip"
          )
          $arguments = @("release", "create", $tag) + $assets + @("--title", "SkuaCraft $version", "--generate-notes", "--target", $env:GITHUB_SHA)
          if ($version -match '(?i)(alpha|beta|rc|preview|pre)') {
            $arguments += "--prerelease"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
